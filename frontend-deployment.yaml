apiVersion: apps/v1

kind: Deployment
metadata:
  name: frontend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend-container
          image: deanalemao/mern-frontend-employee:1fa79a72e473605db47d2f60a2331e9866b62010

          ports:
            - containerPort: 80

          imagePullPolicy: Always
            