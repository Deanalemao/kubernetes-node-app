apiVersion: apps/v1

kind: Deployment
metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend-container
          image: deanalemao/mern-backend-employee:1fa79a72e473605db47d2f60a2331e9866b62010

          ports:
            - containerPort: 5001
          
          envFrom:
            - configMapRef:
                name: backend-config

          imagePullPolicy: Always
            

  